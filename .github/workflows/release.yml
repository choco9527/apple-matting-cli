name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag_version" = "$cargo_version"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin apple-matting-cli
      - name: Package
        shell: bash
        run: |
          package="apple-matting-cli-${GITHUB_REF_NAME}-macos-${{ matrix.archive_arch }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/apple-matting-cli" "$package/"
          cp README.md README.en.md LICENSE "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: apple-matting-cli-${{ matrix.archive_arch }}
          path: |
            apple-matting-cli-*.tar.gz
            apple-matting-cli-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apple-matting-cli-*
          merge-multiple: true
      - name: Create consolidated checksums
        run: cat *.sha256 | sort > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apple-matting-cli-*.tar.gz
            apple-matting-cli-*.tar.gz.sha256
            SHA256SUMS
